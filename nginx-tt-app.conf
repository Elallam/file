# /etc/nginx/sites-available/tt-app
# Replace your.domain.com with your actual domain, or your VPS's IP if you
# don't have one yet (server_name _; also works as a catch-all).

server {
    listen 80;
    server_name your.domain.com;

    # Chromium spin-up + odds fetching can take a while on first load per
    # league/tournament -> give the proxy generous timeouts, matching gunicorn.
    proxy_connect_timeout 120s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
